name: keepalive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping site
        run: |
          curl -s -o /dev/null -w "pages: %{http_code}\n" https://Gennadii75.github.io/sementsul-site/ || true
          curl -s -o /dev/null -w "domain: %{http_code}\n" http://sementsul.info.gf/ || true
      - name: Keepalive commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          if git diff --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .keepalive
          git commit -m "keepalive ping"
          git pull --rebase origin main || true
          git push

