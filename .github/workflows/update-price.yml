name: update-price

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/fetch_price.py
      - run: |
          if git diff --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/price.json
          git commit -m "update price"
          git push
